name: Luminus Devices
description: >-
  Luminus Devices is an optoelectronics manufacturer ("Improving Life with
  Photons") producing solid-state lighting and photonics hardware: COB arrays,
  specialty and color SMD LEDs, UV/IR/horticulture LEDs, green/blue/red
  multi-mode lasers, and power semiconductors (SiC MOSFETs and Schottky barrier
  diodes) for retail, industrial, medical, life-sciences, display, and
  automotive applications. Surfaced as a portfolio company of Battery Ventures
  and added to the API Evangelist network. Enrichment confirmed this is a
  hardware/components company that publishes no public developer API, REST API,
  or developer portal — only a product resources/tools portal.
